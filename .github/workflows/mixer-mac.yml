name: Mixer macOS build

# Builds an ad-hoc signed (not notarized) macOS .dmg of the Mixer branch for testing.
# The .dmg files are attached to the "mixer-latest" pre-release (Releases page) and to the run's Artifacts.
# On failure the tail of the log is written as error annotations, so it can be read from the check run.
on:
  push:
    branches:
      - "feature/mixer-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mixer-mac-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: mixer-latest

jobs:
  mac:
    name: "macOS ${{ matrix.arch }}"
    # each arch on its own runner pool (macOS arm64 runners are often short on capacity)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # node-gyp needs Python < 3.12: https://github.com/nodejs/node-gyp/issues/2869
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a build.log

      - name: Install dmg-license
        run: |
          set -o pipefail
          npm i --no-save dmg-license 2>&1 | tee -a build.log

      - name: Build app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a build.log

      - name: Package .dmg (ad-hoc signed, not notarized)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          # test builds have no Apple Developer account: skip the notarize.js afterSign hook
          printf 'extends: config/building/electron-builder.local.yaml\nafterSign: null\nmac:\n    identity: "-"\n    notarize: false\n' > electron-builder.ci.yaml
          npx electron-builder --config electron-builder.ci.yaml --mac dmg --${{ matrix.arch }} --publish never 2>&1 | tee -a build.log
          ls -la dist

      - name: Upload .dmg (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FreeShow-Mixer-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attach .dmg to the mixer-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "FreeShow Mixer (test build)" \
              --notes "Bản build thử của nhánh Mixer, chưa notarize. Sau khi cài, chạy: xattr -cr /Applications/FreeShow.app" || true
          fi
          for f in dist/*.dmg; do
            target="FreeShow-Mixer-${{ matrix.arch }}.dmg"
            cp "$f" "$target"
            gh release upload "$RELEASE_TAG" "$target" --clobber
          done

      - name: Report log tail as annotations
        if: failure()
        run: |
          # GitHub keeps only ~10 annotations per step, so send chunks of 15 lines each (newlines encoded as %0A)
          touch build.log
          tail -n 120 build.log | grep -v '^\s*$' | tail -n 90 | tr -d '\r' | cut -c1-300 | sed 's/%/%25/g' > tail.log
          split -l 15 tail.log chunk_
          for c in chunk_*; do
            msg=$(awk 'BEGIN{ORS="%0A"} {print}' "$c")
            echo "::error title=Build log (${{ matrix.arch }}) ${c#chunk_}::$msg"
          done
