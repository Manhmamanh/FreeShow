name: Mixer macOS build

# Builds an unsigned (ad-hoc) macOS .dmg of the Mixer branch for testing.
# Download it from the run's "Artifacts" section. Nothing is published as a release.
on:
  push:
    branches:
      - "feature/mixer-*"
  workflow_dispatch:

jobs:
  mac:
    name: "macOS ${{ matrix.arch }}"
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # node-gyp needs Python < 3.12: https://github.com/nodejs/node-gyp/issues/2869
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license
        run: npm i --no-save dmg-license

      - name: Build app
        run: npm run build

      - name: Package .dmg (ad-hoc signed, not notarized)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config config/building/electron-builder.local.yaml --mac dmg --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.notarize=false

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: FreeShow-Mixer-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
